; ============================================================================
; Sensormeter PoE - Waveshare ESP32-S3-ETH
; PlatformIO Projektkonfiguration
; ============================================================================
;
; WICHTIG: platform ist bewusst NICHT das offizielle "espressif32" (das
; buendelt weiterhin Arduino-ESP32 2.0.17, siehe docs/entscheidungen.md) -
; W5500-Ethernet ueber ETH.h braucht Arduino-ESP32 3.x, das offizielle
; PlatformIO-Platform-Release war dafuer zum Zeitpunkt der Erstellung noch
; nicht aktualisiert. Stattdessen "pioarduino", ein Community-Fork, der genau
; dieses Problem loest (identisch zur Begruendung bei sensormeter-poe's
; ESP32-P4-Recherche/board-recherche.md - dasselbe Muster, anderer Chip).
;
; WICHTIG (Windows): pio-Aufrufe fuer dieses Projekt MUESSEN ueber
; PowerShell laufen, NICHT ueber Git-Bash/MSYS - der Toolchain-Installer
; (idf_tools.py) bricht unter MSYS mit "MSys/Mingw is not supported" ab,
; siehe docs/entscheidungen.md.
;
; WICHTIG (Package-Isolation): pioarduino registriert seine Pakete unter
; DENSELBEN Namen wie das offizielle "espressif32" (Plattform UND
; "framework-arduinoespressif32") - ein globaler "pio run" ohne core_dir
; ueberschreibt dadurch den von Sensormeter (WT32-ETH01) und Sensormeter
; WLAN geteilten globalen Paket-Pool (~/.platformio) mit der neueren
; Arduino-ESP32-3.x-Variante und macht beide Schwesterprojekte
; unbaubar (real passiert und wieder repariert, siehe docs/entscheidungen.md)
; - "core_dir" unten isoliert diesen Projekt-Pool komplett vom globalen.

[platformio]
core_dir = .pio-core

[env:esp32-s3-eth]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; Board-Definition "esp32-s3-devkitc-1" passt zum verbauten ESP32-S3R8 (Xtensa
; LX7 Dual-Core, 8MB Octal-PSRAM, 16MB Flash) - kein eigenes Board-JSON noetig,
; nur Flash-Groesse/PSRAM-Modus per build_flags/board_upload.flash_size unten
; an das tatsaechliche 16MB-Board angepasst (Default der Board-Definition ist
; 8MB N8).
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
; 2026-07-18: Octal-PSRAM (ESP32-S3R8, 8MB, laut Waveshare-Produktseite
; im Chip-Package integriert) - funktioniert. Erste Testreihe schlug mit
; "PSRAM chip is not connected, or wrong PSRAM line mode" fehl (sowohl
; opi als auch qio), Ursache war aber ein veralteter, aus einem
; fruehstuecken fehlgeschlagenen Build gecachter bootloader.bin, nicht
; die Hardware/Konfiguration - ein kompletter Clean-Rebuild
; (.pio/build geleert) mit derselben opi-Einstellung lief beim naechsten
; Versuch sauber durch. Siehe docs/entscheidungen.md fuer die volle
; Korrektur-Historie.
board_build.psram_type = opi

monitor_speed = 115200
upload_speed = 921600

; tinyxml2 liegt vendort in lib/tinyxml2/ (identisch zu den beiden
; Schwesterprojekten, siehe lib/tinyxml2/README.md dort) - keine
; lib_deps-Deklaration noetig.

lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    ; I2C-Lesepfad fuer "Sensor 2" (BME280-/AHT20-Modul, siehe
    ; sensormeter-family/repo/module-design/README.md "Firmware-Luecke")
    adafruit/Adafruit BME280 Library@^2.2.4
    adafruit/Adafruit AHTX0@^2.0.5
    ; Erweiterte I2C-Lesepfade fuer "Sensor 2" (Firmware-Luecke aus
    ; sensormeter-family/repo/module-design/README.md): Luftdruck (BMP280),
    ; Helligkeit (BH1750), Luftguete (ENS160).
    adafruit/Adafruit BMP280 Library@^3.0.0
    claws/BH1750@^1.3.0
    adafruit/ENS160 - Adafruit Fork@^3.0.1
    adafruit/Adafruit SSD1306@^2.5.13
    ; SH110X bleibt trotz des internen Displays Umbaus auf SSD1306 noetig -
    ; treibt jetzt das optionale externe RJ45-Display-Steckmodul (SH1107,
    ; siehe sensormeter-family/repo/module-design/sh1107-display-modul.md)
    adafruit/Adafruit SH110X@^2.1.13
    adafruit/Adafruit GFX Library@^1.11.9
    esp32async/ESPAsyncWebServer@^3.11.2
    esp32async/AsyncTCP@^3.4.10
    bblanchon/ArduinoJson@^7.4.3
    0neblock/SNMP_Agent@^2.1.0
    marian-craciunescu/ESP32Ping@^1.7
    knolleary/PubSubClient@^2.8

build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D BOARD_HAS_PSRAM
